name: Deploy website

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.ref }}

permissions:
  contents: write

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24

      - name: Define tag
        id: tag
        run: echo "version=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Replace cache markers
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "YYYY.MM.DD"
          replace: "${{ steps.tag.outputs.version }}"
          regex: false

      - name: Update configs
        shell: pwsh
        working-directory: src
        run: |
          (Get-Content index.html).Replace("__GaTag__", "G-D7NC4KR9YR") | Set-Content index.html
          Write-Host "... Done!"

      - name: Build site (production)
        if: github.ref == 'refs/heads/main'
        run: pnpm run build.prod

      - name: Build site (preview)
        if: github.ref != 'refs/heads/main'
        run: pnpm run build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./
          command: pages deploy dist/app/browser --project-name uswds-design-patterns

      - name: Tag and release note
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main'
        with:
          generateReleaseNotes: true
          draft: true
          tag: ${{ steps.tag.outputs.version }}
          commit: ${{ github.ref_name }}
