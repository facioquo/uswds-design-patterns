name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Angular and Vite
        uses: actions/cache@v6
        with:
          path: |
            .angular/cache
            node_modules/.vite
            node_modules/.cache/angular
          key: ${{ runner.os }}-ngcache-${{ hashFiles('**/pnpm-lock.yaml', 'angular.json', 'tsconfig.json', 'tsconfig.app.json') }}
          restore-keys: |
            ${{ runner.os }}-ngcache-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install

      - name: Run completion gate
        env:
          NG_PERSISTENT_BUILD_CACHE: "1"
        run: pnpm run gate

      - name: Upload coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

      - name: Generate summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "# Test Summary"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              lines=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
              functions=$(node -e "console.log(require('./coverage/coverage-summary.json').total.functions.pct)")
              branches=$(node -e "console.log(require('./coverage/coverage-summary.json').total.branches.pct)")
              statements=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
              echo "- Lines: ${lines}%"
              echo "- Functions: ${functions}%"
              echo "- Branches: ${branches}%"
              echo "- Statements: ${statements}%"
            else
              echo "Coverage summary not found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
